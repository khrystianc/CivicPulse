version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: civicpulse-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: civicpulse
    volumes:
      - mongo-data:/data/db
    networks:
      - civicpulse-network

  backend:
    build: ./backend
    container_name: civicpulse-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_DEBUG=False
      - HOST=0.0.0.0
      - PORT=5000
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DB=civicpulse
      - CORS_ORIGIN=*
    depends_on:
      - mongodb
    networks:
      - civicpulse-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongo-data:
    driver: local

networks:
  civicpulse-network:
    driver: bridge
